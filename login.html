<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Victory Water & Happy Juice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <i class="fas fa-user-lock" style="font-size: 4rem; color: var(--green); margin-bottom: 1rem;"></i>
                <h1 style="color: var(--green);">Victory Water & Happy Juice</h1>
                <p style="color: #666; margin-top: 0.5rem;">Staff Portal Login</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
                </div>
                <div id="errorMessage" style="display: none; color: var(--danger); margin-bottom: 1rem; padding: 0.75rem; background: rgba(231, 76, 60, 0.1); border-radius: 5px; font-size: 0.9rem;"></div>
                <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; justify-content: center;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>
    
    <script src="utils.js"></script>
    <script>
        // Clear any previous session on load
        sessionStorage.clear();

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.toLowerCase().trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            // Clear previous error
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Store role in sessionStorage
                    sessionStorage.setItem('userRole', data.role);
                    sessionStorage.setItem('username', data.username);
                    
                    // Redirect based on role
                    if (data.role === 'hr') {
                        window.location.href = 'index.html';
                    } else if (data.role === 'owner') {
                        window.location.href = 'owner_dashboard.html';
                    }
                } else {
                    // Show error
                    errorDiv.textContent = data.message || 'Invalid username or password. Please check your credentials.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection error. Please check if the server is running.';
                errorDiv.style.display = 'block';
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        }
    </script>
</body>
</html>
